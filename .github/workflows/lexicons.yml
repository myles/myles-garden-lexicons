name: Lexicons

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  LEXICONS_DIR: .

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Check JSON syntax
        run: npm run check:json

      - name: Check ids match paths
        run: npm run check:ids

      - name: Test scripts
        run: npm test

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      # Builds the pinned goat now, so later steps time only themselves.
      - name: Build goat
        run: scripts/goat.sh --version

      - name: Lint
        run: npm run lint

      - name: Validate examples
        run: npm run validate

      # Compares against the published schemas, which are what's on main.
      - name: Check for breaking changes
        run: npm run check:breaking

      # Everything on main must resolve, so new namespaces need DNS first.
      - name: Check DNS resolution
        run: npm run check:dns
